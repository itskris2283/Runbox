name: Runbox CI (Ubuntu 24.04 LTS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-core:
    name: C++20 Core Build, GoogleTest & Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure kernel sysctl for unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install C++ system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libseccomp-dev gcovr

      - name: Initialize Cgroups v2 delegation
        run: |
          sudo mkdir -p /sys/fs/cgroup/runbox
          echo "+memory +cpu +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
          echo "+memory +cpu +pids" | sudo tee /sys/fs/cgroup/runbox/cgroup.subtree_control || true
          RUNNER_USER=$(id -u -n)
          RUNNER_GRP=$(id -g -n)
          sudo chown -R ${RUNNER_USER}:${RUNNER_GRP} /sys/fs/cgroup/runbox
          sudo chmod 777 /sys/fs/cgroup/runbox

      - name: Configure CMake (Release)
        run: |
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build C++ Binaries with strict flags (-Werror)
        run: |
          cmake --build build-release -j$(nproc)
          sudo chmod u+s build-release/runbox-supervisor || true

      - name: Execute GoogleTest suite (96 tests)
        run: |
          sudo ./build-release/runbox_tests

      - name: Configure CMake with Code Coverage instrumentation
        run: |
          cmake -B build-cov -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -DBUILD_TESTS=ON
          cmake --build build-cov -j$(nproc)
          sudo chmod u+s build-cov/runbox-supervisor || true

      - name: Run instrumented tests & generate GCOV report
        run: |
          sudo ./build-cov/runbox_tests
          python3 scripts/generate_cpp_coverage.py build-cov

      - name: Upload C++ coverage report
        uses: actions/upload-artifact@v4
        with:
          name: cpp-coverage-report
          path: build-cov/

  python-control-plane:
    name: Python 3.12 Control Plane & Unit/Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure kernel sysctl for unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install system dependencies & libseccomp
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libseccomp-dev

      - name: Initialize Cgroups v2 delegation
        run: |
          sudo mkdir -p /sys/fs/cgroup/runbox
          echo "+memory +cpu +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
          echo "+memory +cpu +pids" | sudo tee /sys/fs/cgroup/runbox/cgroup.subtree_control || true
          RUNNER_USER=$(id -u -n)
          RUNNER_GRP=$(id -g -n)
          sudo chown -R ${RUNNER_USER}:${RUNNER_GRP} /sys/fs/cgroup/runbox
          sudo chmod 777 /sys/fs/cgroup/runbox

      - name: Build supervisor binary for integration harness
        run: |
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release -j$(nproc)
          sudo chmod u+s build-release/runbox-supervisor || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff static analysis & formatting checks
        run: |
          ruff check .
          ruff format --check .

      - name: Execute Python Unit & Integration Tests
        run: |
          PYTHONPATH=. pytest tests/unit tests/integration --cov=api --cov=runtimes --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload Python test coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml

  adversarial-security:
    name: Adversarial Security Suite (40+ Vectors)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure kernel sysctl for unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libseccomp-dev

      - name: Initialize Cgroups v2 delegation
        run: |
          sudo mkdir -p /sys/fs/cgroup/runbox
          echo "+memory +cpu +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
          echo "+memory +cpu +pids" | sudo tee /sys/fs/cgroup/runbox/cgroup.subtree_control || true
          RUNNER_USER=$(id -u -n)
          RUNNER_GRP=$(id -g -n)
          sudo chown -R ${RUNNER_USER}:${RUNNER_GRP} /sys/fs/cgroup/runbox
          sudo chmod 777 /sys/fs/cgroup/runbox

      - name: Build supervisor binary
        run: |
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release -j$(nproc)
          sudo chmod u+s build-release/runbox-supervisor || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Secret Scan
        run: |
          python3 scripts/secret_scan.py

      - name: Execute 40-Vector Adversarial Security Suite
        run: |
          sudo chmod u+s build-release/runbox-supervisor || true
          PYTHONPATH=. pytest tests/adversarial -v

  frontend-dashboard:
    name: React 18 TypeScript Dashboard Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript typecheck & Vite production build
        run: npm run build

      - name: Upload frontend production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist/
