  <rect x="460" y="75" width="14" height="14" fill="#238636" rx="2"/>
  <text x="480" y="87" fill="#c9d1d9" font-size="12">Stage 2: Sandboxed Binary Exec</text>

  <!-- P50 Breakdown -->
  <text x="220" y="140" fill="#58a6ff" font-size="14" font-weight="bold">P50 (Median): 916.38ms (Target &lt; 1000ms: PASSED)</text>
  <rect x="220" y="150" width="348.8" height="32" fill="#a371f7" rx="4"/>
  <text x="394.4" y="171" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">872.0ms</text>
  
  <rect x="568.8" y="150" width="25" height="32" fill="#238636" rx="4"/>
