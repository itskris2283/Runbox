  <rect x="220" y="225" width="357.588" height="32" fill="#a371f7" rx="4"/>
  <text x="398.794" y="246" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">893.97ms</text>
  
  <rect x="577.588" y="225" width="25" height="32" fill="#238636" rx="4"/>
